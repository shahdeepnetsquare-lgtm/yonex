<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student form</title>
</head>
<body>
    <h1>Student Form</h1>
    <label for="name">FULL NAME</label>
    <input type="text">
    <br>
    <label for="email">EMAIL</label>
    <input type="email">
    <br>
    <label for="phone">PHONE.NO</label>
    <input type="number">
    <br>
   Gender: <label for="gender">MALE</label>
    <input type="radio" id="MALE"  name="GENDER">
    <label for="female">FEMALE</label>
    <input type="radio" id="FEMALE"  name="GENDER">
    <br>
   DOB:  <label for="dob"></label>
    <input type="date"  name="dob" id="dob">
    <br>
  Password: <label for="password"></label>
  <input type="password" required>
    <br>
    <h2> COURSE:</h2><label for="course">FRONTEND DEVELOPER</label>
    <input type="radio" id="FRONTEND DEVELOPER" name="course">
    <label for="course">BACKEND DEVELOPER</label>
    <input type="radio" id="BACKEND DEVELOPER" name="course"><br>
    <label for="course">DATA ANAlYTICS</label>
    <input type="radio" id="DATA ANALYTICS" name="course">
    <label for="course">GRAPHIC DESIGNING</label>
    <input type="radio" id="GRAPHIC DESIGNING" name="course">
    <br>
    <h3>ADDRESS</h3>
    <label for="address"></label>
    <input type="address" id="address">
    <br>
    <h4>RESUME:</h4><label for="RESUME"></label>
    <input type="file"><br>
    <label for="submit"></label>
    <button type="submit"><hr>
</body>
</html>
