<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        html{
            font-size: 16px;
        }

        .parent{
            font-size: 20px;
            border: 2px solid black;
            padding: 20px;
            margin-bottom: 20px;
        }

        .em-text{
            font-size: 4em;
            color: rgb(122, 122, 205);
        }

        .rem-text{
            font-size: 4rem;
            color: rgb(227, 29, 29);
        }

    </style>
</head>
<body>

    <div class="parent">

        <h2>Parent Font Size = 20px</h2>

        <p class="em-text">
            This text uses 2em
        </p>

        <p class="rem-text">
            This text uses 2rem
        </p>

    </div>
</body>
</html>
